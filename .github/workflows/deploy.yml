name: Deploy to us

# 前端：在 GitHub runner 上构建，把 dist/ 通过 SSH 推到 us 服，原子替换 nginx root。
# 不在服务器上构建：那台机器 2 核 1GB，vite build 会跑几十分钟甚至 OOM，
# 而 Vite 的 emptyOutDir 会先清空 dist，中途死亡就整站 403（2026-10-19 16:08 事故）。
#
# 后端：源码打包上传，服务器上 rsync 到 /opt/club_os/backend（保留 .venv/.env/uploads），
# 跑未执行的 migrations/*.sql（schema_migrations 表记录），重启 systemd，健康检查失败自动回滚。
# 两条链路各自独立：只改前端不重启后端，只改后端不重打前端。

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只允许一个部署，避免两次上传交错替换
concurrency:
  group: deploy-us
  cancel-in-progress: false

env:
  DEPLOY_HOST: 203.88.115.113
  DEPLOY_PORT: '23'
  DEPLOY_USER: root
  REMOTE_DIR: /opt/club_os/deploy/repo
  REMOTE_OWNER: www-data:www-data
  BACKEND_DIR: /opt/club_os/backend
  SITE_HOSTNAME: cs.stcnchu.com
  SITE_URL: https://cs.stcnchu.com/

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'public/**'
              - 'index.html'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig*.json'
              - 'vite.config.*'
              - 'tailwind*'
              - 'postcss*'
              - 'eslint.config.js'
              - '.github/workflows/deploy.yml'
            backend:
              - 'backend/**'
              - '.github/workflows/deploy.yml'

  deploy-frontend:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # .env 在 .gitignore 里，构建必须自己生成，否则 VITE_* 全是 undefined，
      # 打出来的包会回落到 mock 数据源、连不上后端。
      - name: Write production .env
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: |
          if [ -z "${PROD_ENV_FILE:-}" ]; then
            echo "::error::缺少仓库 secret PROD_ENV_FILE（生产 .env 全文）"
            exit 1
          fi
          printf '%s\n' "$PROD_ENV_FILE" > .env
          echo "已写入 .env（$(wc -l < .env) 行）"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify build output
        run: |
          set -euo pipefail
          test -f dist/index.html || { echo "::error::构建产物缺 dist/index.html"; exit 1; }
          JS_CSS=$(find dist/assets -type f \( -name '*.js' -o -name '*.css' \) | wc -l)
          echo "js/css 文件数：$JS_CSS"
          if [ "$JS_CSS" -lt 5 ]; then
            echo "::error::assets 里只有 $JS_CSS 个 js/css，疑似半成品"
            exit 1
          fi
          echo "dist 体积：$(du -sh dist | cut -f1)，文件数：$(find dist -type f | wc -l)"

      - name: Package dist
        run: tar -czf dist-upload.tar.gz -C dist .

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
            echo "::error::缺少仓库 secret SSH_PRIVATE_KEY"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "${SSH_HOST_KEY:-}" ]; then
            printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
            echo "已写入 known_hosts"
          else
            echo "::warning::未配置 SSH_HOST_KEY，本次用 accept-new 信任主机指纹"
          fi

      - name: Upload archive
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'cat > /tmp/dist-upload.tar.gz' \
            < dist-upload.tar.gz

      - name: Atomic swap on server
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- \
            "$REMOTE_DIR" "$REMOTE_OWNER" "$SITE_HOSTNAME" "$DEPLOY_SHA" <<'REMOTE'
          set -euo pipefail
          REMOTE_DIR="$1"; OWNER="$2"; SITE_HOSTNAME="$3"; SHA="$4"
          ARCHIVE=/tmp/dist-upload.tar.gz
          cd "$REMOTE_DIR"

          rm -rf dist.new
          mkdir -p dist.new
          tar -xzf "$ARCHIVE" -C dist.new

          # 校验通过才切换，避免出现 dist 是空目录的窗口
          if [ ! -f dist.new/index.html ]; then
            echo "!! 解包后缺 index.html，放弃切换，线上未受影响"
            rm -rf dist.new "$ARCHIVE"
            exit 1
          fi
          JS_CSS=$(find dist.new/assets -type f \( -name '*.js' -o -name '*.css' \) | wc -l)
          if [ "$JS_CSS" -lt 5 ]; then
            echo "!! assets 里只有 $JS_CSS 个 js/css，疑似半成品，放弃切换"
            rm -rf dist.new "$ARCHIVE"
            exit 1
          fi

          chown -R "$OWNER" dist.new
          chmod -R a+rX dist.new

          rm -rf dist.prev
          [ -d dist ] && mv dist dist.prev
          mv dist.new dist
          rm -f "$ARCHIVE"

          echo "index.html: $(stat -c '%s bytes  %y' dist/index.html)"
          echo "js/css: $JS_CSS 个"
          echo "部署来源 commit: $SHA"

          CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Host: $SITE_HOSTNAME" http://127.0.0.1/ || true)
          echo "本机 Host 探测：HTTP $CODE"
          [ "$CODE" = "200" ] || { echo "!! 站点非 200，回滚：ssh 上把 dist.prev 移回 dist"; exit 1; }
          REMOTE

      - name: Verify public URL
        run: |
          curl -sS -o /dev/null --max-time 25 --retry 2 --retry-delay 5 \
            -w "线上 HTTP %{http_code}  ip %{remote_ip}  %{time_total}s\n" \
            "$SITE_URL?ci=${{ github.sha }}" || true

  deploy-backend:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 只打包源码：.venv 153M 不能进包，.env 由服务器本地维护，
      # uploads 是运行时产生的用户文件，覆盖会丢数据。
      - name: Package backend
        run: |
          set -euo pipefail
          cd backend/OS_club
          tar -czf /tmp/backend-upload.tar.gz \
            --owner=0 --group=0 \
            --exclude='.venv' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='uploads' \
            --exclude='.env' \
            --exclude='*.log' \
            --exclude='.pytest_cache' \
            --exclude='.idea' \
            --exclude='.git' \
            .
          echo "打包体积：$(du -h /tmp/backend-upload.tar.gz | cut -f1)"
          echo "文件数：$(find . -type f ! -path './.venv/*' ! -path '*/__pycache__/*' | wc -l)"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
            echo "::error::缺少仓库 secret SSH_PRIVATE_KEY"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "${SSH_HOST_KEY:-}" ]; then
            printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          fi

      - name: Upload archive
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'cat > /tmp/backend-upload.tar.gz' \
            < /tmp/backend-upload.tar.gz

      - name: Deploy backend on server
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- \
            "$BACKEND_DIR" "$DEPLOY_SHA" <<'REMOTE'
          set -euo pipefail
          BACKEND_DIR="$1"; SHA="$2"
          ARCHIVE=/tmp/backend-upload.tar.gz
          STAGE=/tmp/backend-stage
          TS=$(date +%Y%m%d-%H%M%S)
          BACKUP="/opt/club_os/backups/backend-ci-$TS.tar.gz"

          echo "=== 1. 备份当前后端 ==="
          mkdir -p /opt/club_os/backups
          tar -czf "$BACKUP" --exclude='.venv' --exclude='__pycache__' --exclude='.git' \
            -C /opt/club_os backend
          echo "备份：$BACKUP（$(du -h "$BACKUP" | cut -f1)）"

          echo "=== 2. 解包到暂存区 ==="
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          tar -xzf "$ARCHIVE" -C "$STAGE"
          echo "待部署文件数：$(find "$STAGE" -type f | wc -l)"

          echo "=== 3. 语法检查 ==="
          if ! ( cd "$STAGE" && "$BACKEND_DIR/.venv/bin/python" -m compileall -q . >/dev/null ); then
            echo "!! 语法检查失败，线上未受影响"
            rm -rf "$STAGE" "$ARCHIVE"
            exit 1
          fi
          echo "语法检查通过"

          echo "=== 4. 同步代码（保留 .venv/.env/uploads/.git）==="
          # -rlptD 不含 -o/-g：runner 打包的 uid 是 1001，保留会把文件 owner 写成
          # 不存在的用户，git 随后拒绝工作（dubious ownership）。
          rsync -rlptD --delete --no-owner --no-group \
            --exclude='.venv/' \
            --exclude='.env' \
            --exclude='uploads/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='*.log' \
            --exclude='.git/' \
            --exclude='.gitignore' \
            "$STAGE/" "$BACKEND_DIR/"
          echo "同步完成"

          # 依赖只在 requirements.txt 变动时安装：md5 记在 .venv 里，
          # .venv 不进 tar 包也不被 rsync 覆盖，所以这份戳能跨部署保留。
          echo "=== 5. 同步 Python 依赖 ==="
          REQ_FILE="$BACKEND_DIR/requirements.txt"
          REQ_STAMP="$BACKEND_DIR/.venv/.requirements-md5"
          if [ -f "$REQ_FILE" ]; then
            NEW_HASH=$(md5sum "$REQ_FILE" | cut -d' ' -f1)
            OLD_HASH=$(cat "$REQ_STAMP" 2>/dev/null || echo "")
            if [ "$NEW_HASH" = "$OLD_HASH" ]; then
              echo "requirements.txt 未变化，跳过"
            else
              echo "依赖有变化（${OLD_HASH:-空} → $NEW_HASH），开始安装"
              if "$BACKEND_DIR/.venv/bin/python" -m pip install \
                   --disable-pip-version-check --no-cache-dir \
                   -r "$REQ_FILE" > /tmp/pip-install.log 2>&1; then
                echo "$NEW_HASH" > "$REQ_STAMP"
                echo "依赖安装完成：$(grep -c 'Successfully installed' /tmp/pip-install.log || true) 组"
              else
                echo "!! 依赖安装失败，最后 30 行："
                tail -30 /tmp/pip-install.log
                echo "!! 回滚代码"
                tar -xzf "$BACKUP" -C /opt/club_os --overwrite
                rm -rf "$STAGE" "$ARCHIVE"
                exit 1
              fi
            fi
          else
            echo "!! 未找到 requirements.txt，跳过依赖安装"
          fi

          echo "=== 6. 执行待跑迁移 ==="
          APPLIED=0
          cd "$BACKEND_DIR/migrations"
          for f in *.sql; do
            if mysql -N -e "SELECT 1 FROM club_os.schema_migrations WHERE filename='$f'" 2>/dev/null | grep -q 1; then
              continue
            fi
            echo "执行迁移：$f"
            if mysql club_os < "$f" 2>/tmp/mig.err; then
              mysql club_os -e "INSERT INTO schema_migrations (filename) VALUES ('$f')"
              APPLIED=$((APPLIED + 1))
              echo "  ok"
            else
              echo "!! 迁移失败：$(cat /tmp/mig.err)"
              echo "!! 回滚代码"
              tar -xzf "$BACKUP" -C /opt/club_os --overwrite
              rm -rf "$STAGE" "$ARCHIVE"
              exit 1
            fi
          done
          echo "本次执行迁移：$APPLIED 个"

          echo "=== 7. 重启服务 ==="
          systemctl restart club-os-backend
          CODE=""
          for i in $(seq 1 10); do
            sleep 3
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 5 http://127.0.0.1:8000/api/health || true)
            [ "$CODE" = "200" ] && break
          done

          if [ "$CODE" != "200" ]; then
            echo "!! 健康检查失败（HTTP $CODE），回滚代码"
            tar -xzf "$BACKUP" -C /opt/club_os --overwrite
            systemctl restart club-os-backend
            sleep 8
            RC=$(curl -s -o /dev/null -w '%{http_code}' -m 5 http://127.0.0.1:8000/api/health || true)
            echo "回滚后健康检查：HTTP $RC"
            rm -rf "$STAGE" "$ARCHIVE"
            exit 1
          fi

          echo "=== 8. 同步服务器 git 记录 ==="
          cd "$BACKEND_DIR"
          git add -A >/dev/null 2>&1 || true
          git commit -m "deploy: $SHA" >/dev/null 2>&1 || true

          rm -rf "$STAGE" "$ARCHIVE"
          echo "部署完成：健康检查 200，commit $SHA"
          REMOTE

      - name: Verify public API
        run: |
          curl -sS --max-time 25 --retry 2 --retry-delay 5 \
            -w "\n线上 API HTTP %{http_code}  %{time_total}s\n" \
            "$SITE_URL/api/health" || true
