      - name: name
        in: path
        required: true
        description: 原始文件名（仅用于友好 URL）
        schema: { type: string }
    get:
      tags: [Uploads]
      summary: 下载上传文件
      operationId: downloadAsset
      security: []
      responses:
        '200':
          description: 文件流
          content:
            image/*:
              schema: { type: string, format: binary }
            application/octet-stream:
              schema: { type: string, format: binary }
        '404':
          $ref: '#/components/responses/NotFound'
