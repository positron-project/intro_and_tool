          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          description: AI 服务不可用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Java Core 登录返回的 accessToken
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    Search:
      name: search
      in: query
      schema: { type: string }
      description: 在记录字段中模糊搜索
    Category:
      name: category
      in: query
      schema: { type: string }
    Status:
      name: status
      in: query
      schema: { type: string }
    Cohort:
      name: cohortId
      in: query
      schema: { type: string }
    Team:
      name: teamId
      in: query
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Sort:
      name: sort
      in: query
      schema: { type: string }
    Direction:
      name: direction
      in: query
      schema: { type: string, enum: [asc, desc], default: asc }
  responses:
    Unauthorized:
      description: 未登录或令牌失效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 当前账号无权管理该内容
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: 请求不符合当前业务规则
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: 与已有数据发生冲突
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: 参数校验失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 内容不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [code, msg, data]
      properties:
        code: { type: integer, description: 业务状态码，200 表示成功 }
        msg: { type: string, nullable: true }
        data: { nullable: true, description: 失败时通常为 null }
    Result:
      type: object
      required: [code, msg, data]
      properties:
        code: { type: integer, description: 业务状态码，200 表示成功 }
        msg: { type: string, nullable: true }
        data: { nullable: true }
    PageInfo:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    ContentPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ContentRecord' }
        page: { $ref: '#/components/schemas/PageInfo' }
    ContentRecord:
      type: object
      required: [id]
      properties:
        id: { type: string }
        title: { type: string }
        name: { type: string }
        description: { type: string }
        cohort: { type: string }
        category: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        createdBy: { type: string }
        updatedBy: { type: string }
        publishedAt: { type: string, format: date-time }
        archivedAt: { type: string, format: date-time }
        visibility: { type: string, enum: [public, members] }
      additionalProperties: true
    ContentInput:
      type: object
      description: 新增记录；不要提交 id 或审计字段。
      additionalProperties: true
    ContentPatch:
      type: object
      description: 部分更新；只提交需要改变的字段。
      additionalProperties: true
    LearningRoute:
      allOf:
        - $ref: '#/components/schemas/ContentRecord'
        - type: object
          required: [title, description, nodes]
          properties:
            title: { type: string }
            description: { type: string }
            nodes: { type: array, items: { $ref: '#/components/schemas/LearningNode' } }
    LearningNode:
      type: object
      required: [id, title, duration, resources, projects]
      properties:
        id: { type: string }
        title: { type: string }
        duration: { type: string }
        resources: { type: integer }
        projects: { type: integer }
        description: { type: string }
    Project:
      allOf:
        - $ref: '#/components/schemas/ContentRecord'
        - type: object
          required: [name, slug, description, stack, members, stars, status, difficulty, year, category, accent, icon]
          properties:
            name: { type: string }
            slug: { type: string }
            description: { type: string }
            stack: { type: array, items: { type: string } }
            members: { type: integer }
            stars: { type: integer }
            status: { type: string }
            difficulty: { type: integer }
            year: { type: integer }
            category: { type: string }
            accent: { type: string }
            icon: { type: string }
            featured: { type: boolean }
    ProjectCategory:
      type: object
      required: [id, resource, key, label, accent, icon, order, enabled, builtIn]
      properties:
        id: { type: string }
        resource: { type: string, enum: [projects, resources, interviews] }
        key: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,31}$' }
        label: { type: string, minLength: 1, maxLength: 32 }
        description: { type: string, maxLength: 120 }
        accent: { type: string, enum: [blue, violet, mint, orange, rose] }
        icon: { type: string }
        order: { type: integer, minimum: 1 }
        enabled: { type: boolean }
        builtIn: { type: boolean }
    ProjectCategoryInput:
      type: object
      required: [resource, key, label, accent, icon, order, enabled]
      properties:
        resource: { type: string, enum: [projects, resources, interviews] }
        key: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,31}$' }
        label: { type: string, minLength: 1, maxLength: 32 }
        description: { type: string, maxLength: 120 }
        accent: { type: string, enum: [blue, violet, mint, orange, rose] }
        icon: { type: string }
        order: { type: integer, minimum: 1 }
        enabled: { type: boolean }
    ProjectCategoryPatch:
      type: object
      description: 部分更新；内置分类的 key 不可修改。
      properties:
        key: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,31}$' }
        label: { type: string, minLength: 1, maxLength: 32 }
        description: { type: string, maxLength: 120 }
        accent: { type: string, enum: [blue, violet, mint, orange, rose] }
        icon: { type: string }
        order: { type: integer, minimum: 1 }
        enabled: { type: boolean }
    Resource:
      allOf:
        - $ref: '#/components/schemas/ContentRecord'
        - type: object
          required: [title, description, category, type, tags, author, updated, views, accent]
          properties:
            title: { type: string }
            description: { type: string }
            category: { type: string }
            type: { type: string }
            tags: { type: array, items: { type: string } }
            author: { type: string }
            updated: { type: string }
            views: { type: integer }
            accent: { type: string }
    Interview:
      allOf:
        - $ref: '#/components/schemas/ContentRecord'
        - type: object
          required: [company, role, author, cohort, date, difficulty, rounds, tags, summary]
          properties:
            company: { type: string }
            role: { type: string }
            author: { type: string }
            cohort: { type: string }
            category: { type: string, description: 关联面经分类 key }
            date: { type: string }
            difficulty: { type: string, enum: [简单, 中等, 困难] }
            rounds: { type: integer }
            tags: { type: array, items: { type: string } }
            summary: { type: string }
    Competition:
      allOf:
        - $ref: '#/components/schemas/ContentRecord'
        - type: object
          required: [id, title, type, date, deadline, description, status, accent, lifecycle, tracks, projects]
          properties:
            title: { type: string }
            seriesName: { type: string, nullable: true }
            type: { type: string }
            organizer: { type: string, nullable: true }
            officialUrl: { type: string, nullable: true }
            registrationStart: { type: string, nullable: true }
            registrationEnd: { type: string, nullable: true }
            eventStart: { type: string, nullable: true }
            eventEnd: { type: string, nullable: true }
            resultDate: { type: string, nullable: true }
            lifecycle: { type: string, enum: [draft, published, archived] }
            date: { type: string }
            deadline: { type: string }
            description: { type: string }
            status:
              type: string
              enum: [草稿, 即将报名, 报名中, 报名已截止, 即将开始, 比赛进行中, 等待结果, 已结束]
            accent: { type: string }
            visibility: { type: string, enum: [public, members, contributors] }
            tracks:
              type: array
              items: { $ref: '#/components/schemas/CompetitionTrack' }
            projects:
              type: array
              items: { $ref: '#/components/schemas/CompetitionProject' }
            createdBy: { type: string, nullable: true }
            updatedBy: { type: string, nullable: true }
            publishedAt: { type: string, format: date-time, nullable: true }
            archivedAt: { type: string, format: date-time, nullable: true }
    CompetitionTrack:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        audience: { type: string, nullable: true }
        format: { type: string, nullable: true }
        teamSize: { type: string, nullable: true }
        requirements: { type: string, nullable: true }
        registrationStart: { type: string, nullable: true }
        registrationEnd: { type: string, nullable: true }
        registrationUrl: { type: string, nullable: true }
        rulesUrl: { type: string, nullable: true }
        awards: { type: string, nullable: true }
    CompetitionProject:
      type: object
      required: [id, title, cohort, description, sortOrder]
      properties:
        id: { type: string }
        title: { type: string }
        cohort: { type: string }
        cohortId: { type: string, nullable: true }
        description: { type: string }
        imageUrl: { type: string, nullable: true }
        imageAssetId: { type: string, nullable: true }
        projectUrl: { type: string, nullable: true }
        sortOrder: { type: integer }
    CompetitionInput:
      allOf:
        - $ref: '#/components/schemas/CompetitionPatch'
        - type: object
          required: [title, description]
    CompetitionPatch:
      type: object
      description: 只提交需要修改的字段；tracks 传空数组表示清空赛道。
      properties:
        title: { type: string, maxLength: 150 }
        seriesName: { type: string, nullable: true }
        type: { type: string, default: 其他 }
        organizer: { type: string, nullable: true }
        officialUrl: { type: string, nullable: true }
        registrationStart: { type: string, nullable: true }
        registrationEnd: { type: string, nullable: true }
        eventStart: { type: string, nullable: true }
        eventEnd: { type: string, nullable: true }
        resultDate: { type: string, nullable: true }
        lifecycle: { type: string, enum: [draft, published, archived], default: draft }
        date: { type: string }
        deadline: { type: string }
        description: { type: string, maxLength: 10000 }
        status: { type: string, default: 草稿 }
        accent: { type: string, default: blue }
        visibility: { type: string, enum: [public, members, contributors], default: members }
        tracks:
          type: array
          items: { $ref: '#/components/schemas/CompetitionTrack' }
    Announcement:
      allOf:
        - $ref: '#/components/schemas/ContentRecord'
        - type: object
          required: [title, category, detail, date]
          properties:
            title: { type: string }
            category: { type: string }
            detail: { type: string }
            date: { type: string }
    Prompt:
      type: object
      required: [id, title, usage, model, category, preview, status, favoriteCount, isFavorited]
      properties:
        id: { type: string }
        title: { type: string, maxLength: 150 }
        usage: { type: string, maxLength: 500 }
        model: { type: string, maxLength: 100 }
        category: { type: string, maxLength: 50 }
        preview: { type: string, maxLength: 4000 }
        status: { type: string, enum: [pending, approved, rejected, changes_requested, archived] }
        favoriteCount: { type: integer, minimum: 0 }
        isFavorited: { type: boolean }
        createdAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }
    PromptReview:
      allOf:
        - $ref: '#/components/schemas/Prompt'
        - type: object
          properties:
            submitterId: { type: string, nullable: true }
            submitterName: { type: string, nullable: true }
            submitterCohort: { type: string, nullable: true }
            submitterDirection: { type: string, nullable: true }
            submittedAt: { type: string, format: date-time, nullable: true }
            reviewedAt: { type: string, format: date-time, nullable: true }
            reviewNote: { type: string, nullable: true }
    PromptInput:
      type: object
      required: [title, category, preview]
      properties:
        title: { type: string, minLength: 1, maxLength: 150 }
        usage: { type: string, maxLength: 500, default: '' }
        model: { type: string, maxLength: 100, default: 通用模型 }
        category: { type: string, minLength: 1, maxLength: 50 }
        preview: { type: string, minLength: 1, maxLength: 4000 }
    PromptPatch:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 150 }
        usage: { type: string, maxLength: 500 }
        model: { type: string, maxLength: 100 }
        category: { type: string, minLength: 1, maxLength: 50 }
        preview: { type: string, minLength: 1, maxLength: 4000 }
    SiteCopy:
      type: object
      required: [id, label, title, body, updatedAt]
      properties:
        id: { type: string }
        label: { type: string }
        title: { type: string }
        body: { type: string }
        author: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time }
    Cohort:
      type: object
      required: [id, year, generationLabel, status, description, teams, createdAt, updatedAt]
      properties:
        id: { type: string }
        year: { type: string }
        generationLabel: { type: string }
        status: { type: string, enum: [active, archived, draft] }
        description: { type: string }
        teams:
          type: array
          items: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CohortInput:
      type: object
      required: [year]
      properties:
        year: { type: string, minLength: 1, maxLength: 20 }
        generationLabel: { type: string, maxLength: 100, default: '' }
        status: { type: string, enum: [active, archived, draft], default: draft }
        description: { type: string, default: '' }
    CohortPatch:
      type: object
      properties:
        year: { type: string, minLength: 1, maxLength: 20 }
        generationLabel: { type: string, maxLength: 100 }
        status: { type: string, enum: [active, archived, draft] }
        description: { type: string }
    CohortPhoto:
      type: object
      required: [id, cohortId, dataUrl, name, caption, isCover, createdAt]
      properties:
        id: { type: string }
        cohortId: { type: string }
        dataUrl: { type: string, description: 图片上传接口返回的 URL }
        name: { type: string }
        caption: { type: string }
        isCover: { type: boolean }
        createdAt: { type: string, format: date-time }
    CohortPhotoInput:
      type: object
      required: [cohortId, dataUrl, name, caption]
      properties:
        cohortId: { type: string }
        dataUrl: { type: string, description: 图片上传接口返回的 URL }
        name: { type: string, minLength: 1, maxLength: 255 }
        caption: { type: string, minLength: 1, maxLength: 255 }
        isCover: { type: boolean, default: false }
    CohortPhotoPatch:
      type: object
      properties:
        dataUrl: { type: string, nullable: true }
        name: { type: string, minLength: 1, maxLength: 255, nullable: true }
        caption: { type: string, minLength: 1, maxLength: 255, nullable: true }
        isCover: { type: boolean, nullable: true }
    Member:
      allOf:
        - $ref: '#/components/schemas/ContentRecord'
        - type: object
          required: [name, role, cohort, direction, projects, initials, accent]
          properties:
            name: { type: string }
            role: { type: string }
            cohort: { type: string }
            direction: { type: string }
            projects: { type: array, items: { type: string } }
            initials: { type: string }
            accent: { type: string }
    UploadAsset:
      type: object
      required: [id, url, name, mimeType, size]
      properties:
        id: { type: string }
        url: { type: string }
        name: { type: string }
        mimeType: { type: string }
        size: { type: integer }
        alt: { type: string }
    Citation:
      type: object
      required: [id, title, type, path]
      properties:
        id: { type: string }
        title: { type: string }
        type: { type: string }
        path: { type: string }
    LoginRequest:
      type: object
      required: [email, password, turnstileToken, rememberMe]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 1 }
        turnstileToken: { type: string, minLength: 1 }
        rememberMe: { type: boolean, default: true }
    LoginCodeRequest:
      type: object
      required: [email, verificationCode, turnstileToken, rememberMe]
      properties:
        email: { type: string, format: email }
        verificationCode: { type: string, pattern: '^[0-9]{6}$' }
        turnstileToken: { type: string, minLength: 1 }
        rememberMe: { type: boolean, default: true }
    LoginCodeSendRequest:
      type: object
      required: [email, turnstileToken]
      properties:
        email: { type: string, format: email }
        turnstileToken: { type: string, minLength: 1 }
    RegistrationCodeRequest:
      type: object
      required: [email, turnstileToken]
      properties:
        email: { type: string, format: email }
        turnstileToken: { type: string, minLength: 1 }
    RegistrationCodeResult:
      type: object
      required: [expiresInSeconds]
      properties:
        expiresInSeconds: { type: integer, minimum: 60 }
    RegisterRequest:
      type: object
      required: [username, email, verificationCode, password, turnstileToken]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        email: { type: string, format: email }
        verificationCode: { type: string, pattern: '^[0-9]{6}$' }
        password: { type: string, format: password, minLength: 8 }
        turnstileToken: { type: string, minLength: 1 }
    AuthUser:
      type: object
      required: [id, name, email, initials, cohort, role, directions]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        initials: { type: string }
        cohort: { type: string }
        role: { type: string, enum: [Visitor, Member, Contributor, Leader, Admin] }
        directions: { type: array, items: { type: string } }
        avatarUrl: { type: string, format: uri }
    AuthSession:
      type: object
      required: [accessToken, expiresAt, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/AuthUser' }
    DependencyHealth:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [up, degraded, down] }
        httpStatus: { type: integer }
        error: { type: string }
    GatewayHealth:
      type: object
      required: [status, service, requestId, dependencies]
      properties:
        status: { type: string, enum: [ok, degraded] }
        service: { type: string, example: node-gateway }
        requestId: { type: string }
        dependencies:
          type: object
          properties:
            core: { $ref: '#/components/schemas/DependencyHealth' }
            ai: { $ref: '#/components/schemas/DependencyHealth' }
    AskRequest:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string, minLength: 1, maxLength: 4000 }
    AIMessage:
      type: object
      required: [id, role, content, citations]
      properties:
        id: { type: string }
        role: { type: string, enum: [assistant] }
        content: { type: string }
        citations: { type: array, items: { $ref: '#/components/schemas/Citation' }}
