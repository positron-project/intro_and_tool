openapi: 3.1.0
info:
  title: Club OS API
  version: 1.0.0
  description: |
    南昌航空大学科技学院计算机科技小组 Club OS 后端接口。
    浏览器只访问 Node.js Gateway，Gateway 再转发到 Java Core、Python AI 或对象存储。
    所有写操作由 Java Core 再次执行角色校验；删除采用软删除。
    Java Core 业务响应统一使用 Result<T>：{ code: 200, msg: null, data: ... }。
    code=200 表示业务成功，其他 code 表示业务失败；本文各业务 schema 描述 data 的内容。
servers:
  - url: http://127.0.0.1:3000
    description: 本地 Node.js Gateway
tags:
  - name: System
    description: 网关与依赖健康状态
  - name: Auth
    description: 登录、会话与角色
  - name: Content
    description: 学习路线、项目、资源、面经、比赛、公告、Prompt 和成员
  - name: Uploads
    description: 图片和附件
  - name: AI
    description: Python AI 助手
paths:
  /health:
    get:
      tags: [System]
      summary: 聚合健康检查
      operationId: getHealth
      responses:
        '200':
          description: 依赖均正常
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayHealth' }
        '503':
          description: 至少一个依赖不可用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayHealth' }
  /api/health:
    get:
      tags: [System]
      summary: 聚合健康检查（API 别名）
      operationId: getApiHealth
      responses:
        '200':
          description: 依赖均正常
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayHealth' }
        '503':
          description: 至少一个依赖不可用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayHealth' }
  /api/auth/login:
    post:
      tags: [Auth]
      summary: 登录并取得 access token
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/auth/login/send-code:
    post:
      tags: [Auth]
      summary: 发送登录邮箱验证码
      operationId: sendLoginCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginCodeSendRequest' }
      responses:
        '202':
          description: 验证码已发送
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationCodeResult' }
        '404':
          description: 邮箱尚未注册
        '429':
          description: 发送过于频繁
  /api/auth/login/code:
    post:
      tags: [Auth]
      summary: 使用邮箱验证码登录
      operationId: loginWithCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginCodeRequest' }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/auth/register/send-code:
    post:
      tags: [Auth]
      summary: 发送注册邮箱验证码
      operationId: sendRegistrationCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationCodeRequest' }
      responses:
        '202':
          description: 验证码已发送
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationCodeResult' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: 发送过于频繁
  /api/auth/register:
    post:
      tags: [Auth]
      summary: 注册小组账号
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '200':
          description: 注册成功并创建会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '409':
          description: 账号或邮箱已存在
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/auth/me:
    get:
      tags: [Auth]
      summary: 获取当前用户
      operationId: getCurrentUser
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUser' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Auth]
      summary: 更新当前用户公开资料
      operationId: updateCurrentUser
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                initials: { type: string }
                bio: { type: string }
                avatarAssetId: { type: string }
      responses:
        '200':
          description: 更新后的用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUser' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: 刷新登录令牌
      operationId: refreshAuth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: 新的登录会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/me/password:
    patch:
      tags: [Auth]
      summary: 修改当前用户密码
      operationId: changeCurrentPassword
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, minLength: 8 }
      responses:
        '204': { description: 密码修改成功 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: 注销当前令牌
      operationId: logout
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: 注销成功或重复注销 }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/learning-routes:
    get:
      tags: [Content]
      summary: 学习路线列表
      operationId: listLearningRoutes
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Category'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Cohort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
      responses:
        '200':
          description: 分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentPage' }
    post:
      tags: [Content]
      summary: 创建学习路线记录
      operationId: createLearningRoute
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentInput' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearningRoute' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/learning-routes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: 学习路线记录 id
        schema: { type: string }
    get:
      tags: [Content]
      summary: 学习路线详情
      operationId: getLearningRoute
      responses:
        '200':
          description: 详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearningRoute' }
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Content]
      summary: 编辑学习路线
      operationId: updateLearningRoute
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentPatch' }
      responses:
        '200':
          description: 更新后的记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearningRoute' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Content]
      summary: 归档学习路线
      operationId: deleteLearningRoute
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: 归档成功 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/projects:
    get:
      tags: [Content]
      summary: 项目库列表
      operationId: listProjects
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Category'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Cohort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
      responses:
        '200':
          description: 分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentPage' }
    post:
      tags: [Content]
      summary: 创建项目库记录
      operationId: createProject
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentInput' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/projects/my-submissions:
    get:
      tags: [Content]
      summary: 查询当前用户提交的全部项目
      operationId: listMyProjectSubmissions
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 当前用户提交的全部项目及其审核状态
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Project' }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/projects/{project_id}/resubmit:
    parameters:
      - name: project_id
        in: path
        required: true
        description: 项目编号
        schema: { type: integer }
    post:
      tags: [Content]
      summary: 修改并重新提交被退回的项目
      operationId: resubmitProject
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentPatch' }
      responses:
        '200':
          description: 项目已更新并重新进入待审核状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400':
          description: 项目当前状态不允许重新提交
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/projects/{idOrSlug}:
    parameters:
      - name: idOrSlug
        in: path
        required: true
        description: 项目 id 或 slug
        schema: { type: string }
    get:
      tags: [Content]
      summary: 项目库详情
      operationId: getProject
      responses:
        '200':
          description: 详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Content]
      summary: 编辑项目库
      operationId: updateProject
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentPatch' }
      responses:
        '200':
          description: 更新后的记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Content]
      summary: 归档项目库
      operationId: deleteProject
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: 归档成功 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/categories:
    get:
      tags: [Content]
      summary: 内容分类列表
      operationId: listContentCategories
      parameters:
        - name: resource
          in: query
          required: true
          description: 分类所属内容模块
          schema: { type: string, enum: [projects, resources, interviews] }
      responses:
        '200':
          description: 分类列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProjectCategory' }
    post:
      tags: [Content]
      summary: 新增内容分类
      operationId: createContentCategory
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCategoryInput' }
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectCategory' }
        '409':
          $ref: '#/components/responses/Conflict'
  /api/categories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Content]
      summary: 编辑内容分类
      operationId: updateContentCategory
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCategoryPatch' }
      responses:
        '200':
          description: 更新后的分类
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectCategory' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Content]
      summary: 删除内容分类
      operationId: deleteContentCategory
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: 删除成功 }
        '409':
          $ref: '#/components/responses/Conflict'
  /api/resources:
    get:
      tags: [Content]
      summary: 资源库列表
      operationId: listResources
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Category'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Cohort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
      responses:
        '200':
          description: 分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentPage' }
    post:
      tags: [Content]
      summary: 创建资源库记录
      operationId: createResource
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentInput' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resource' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/resources/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: 资源库记录 id
        schema: { type: string }
    get:
      tags: [Content]
      summary: 资源库详情
      operationId: getResource
      responses:
        '200':
          description: 详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resource' }
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Content]
      summary: 编辑资源库
      operationId: updateResource
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentPatch' }
      responses:
        '200':
          description: 更新后的记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resource' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Content]
      summary: 归档资源库
      operationId: deleteResource
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: 归档成功 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/interviews:
    get:
      tags: [Content]
      summary: 面经墙列表
      operationId: listInterviews
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Category'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Cohort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
      responses:
        '200':
          description: 分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentPage' }
    post:
      tags: [Content]
      summary: 创建面经墙记录
      operationId: createInterview
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentInput' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Interview' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/interviews/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: 面经墙记录 id
        schema: { type: string }
    get:
      tags: [Content]
      summary: 面经墙详情
      operationId: getInterview
      responses:
        '200':
          description: 详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Interview' }
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Content]
      summary: 编辑面经墙
      operationId: updateInterview
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentPatch' }
      responses:
        '200':
          description: 更新后的记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Interview' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Content]
      summary: 归档面经墙
      operationId: deleteInterview
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: 归档成功 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/competitions:
    get:
      tags: [Competitions]
      summary: 比赛中心列表
      operationId: listCompetitions
      responses:
        '200':
          description: 根据当前用户角色和赛事可见范围返回列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Competition' }
    post:
      tags: [Competitions]
      summary: 创建比赛中心记录
      operationId: createCompetition
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompetitionInput' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Competition' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/competitions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: 比赛中心记录 id
        schema: { type: string }
    get:
      tags: [Competitions]
      summary: 比赛中心详情
