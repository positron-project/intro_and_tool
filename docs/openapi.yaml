openapi: 3.1.0
info:
  title: Club OS API
  version: 1.0.0
  description: |
    南昌航空大学科技学院计算机科技小组 Club OS 后端接口。
    浏览器只访问 Node.js Gateway，Gateway 再转发到 Java Core、Python AI 或对象存储。
    所有写操作由 Java Core 再次执行角色校验；删除采用软删除。
    除 204 外，成功响应统一使用 { data, meta } 包装；本文各业务 schema 描述 data 的内容，meta 至少包含 requestId，分页列表还包含 page、pageSize、total、totalPages。
servers:
  - url: http://127.0.0.1:3000
    description: 本地 Node.js Gateway
tags:
  - name: System
    description: 网关与依赖健康状态
  - name: Auth
    description: 登录、会话与角色
  - name: Content
    description: 学习路线、项目、资源、面经、比赛、公告、Prompt 和成员
  - name: Uploads
    description: 图片和附件
  - name: AI
    description: Python AI 助手
paths:
  /health:
    get:
      tags: [System]
      summary: 聚合健康检查
      operationId: getHealth
      responses:
        '200':
          description: 依赖均正常
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayHealth' }
        '503':
          description: 至少一个依赖不可用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayHealth' }
  /api/health:
    get:
      tags: [System]
      summary: 聚合健康检查（API 别名）
      operationId: getApiHealth
      responses:
        '200':
          description: 依赖均正常
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayHealth' }
        '503':
          description: 至少一个依赖不可用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayHealth' }
  /api/auth/login:
    post:
      tags: [Auth]
      summary: 登录并取得 access token
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/auth/me:
    get:
      tags: [Auth]
      summary: 获取当前用户
      operationId: getCurrentUser
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUser' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Auth]
      summary: 更新当前用户公开资料
      operationId: updateCurrentUser
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                initials: { type: string }
                bio: { type: string }
                avatarAssetId: { type: string }
      responses:
        '200':
          description: 更新后的用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUser' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: 刷新登录令牌
      operationId: refreshAuth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: 新的登录会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/me/password:
    patch:
      tags: [Auth]
      summary: 修改当前用户密码
      operationId: changeCurrentPassword
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, minLength: 8 }
      responses:
        '204': { description: 密码修改成功 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: 注销当前令牌
      operationId: logout
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: 注销成功或重复注销 }
        '401':
          $ref: '#/components/responses/Unauthorized'
